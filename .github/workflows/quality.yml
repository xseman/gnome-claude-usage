name: Quality checks

on:
    pull_request:
        branches:
            - master
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: read

jobs:
    shell:
        name: Shell
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: shellcheck
              run: shellcheck build.sh install.sh pack.sh test/run.sh

            - name: parse
              run: |
                  sh -n test/run.sh
                  bash -n build.sh
                  bash -n install.sh
                  bash -n pack.sh

    typescript:
        name: TypeScript
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: install
              run: bun install --frozen-lockfile

            - name: typecheck
              run: bun run typecheck

            - name: install gjs
              run: |
                  sudo apt-get update
                  # gir1.2-soup-3.0 is the Soup typelib the live fetch client
                  # imports; the tests load that module even though they never
                  # touch the network.
                  sudo apt-get install --no-install-recommends -y gjs libglib2.0-bin gir1.2-soup-3.0

            - name: schema
              run: glib-compile-schemas --strict --dry-run src/schemas

            - name: test
              run: bun run test

    fmt:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dprint/check@v2.3

    shexli:
        name: Shexli
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: install
              run: |
                  bun install --frozen-lockfile
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libglib2.0-bin
                  # tree-sitter 0.26 is ABI-incompatible with the grammar shexli
                  # pins and segfaults on resource:/// imports; stay below it.
                  pip install -U shexli 'tree-sitter<0.26'

            - name: pack
              run: bun run pack

            # Warnings are reported but tolerated: EGO-P-007 is inherent, the
            # status line wrapper is run by Claude Code, not imported.
            - name: analyze
              run: |
                  shexli dist/*.shell-extension.zip || true
                  shexli --format json dist/*.shell-extension.zip > shexli.json || true
                  errors=$(python3 -c "import json;print(json.load(open('shexli.json'))['summary'].get('severity_counts', {}).get('error', 0))")
                  echo "errors: $errors"
                  [ "$errors" = "0" ]
