name: Release Please

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        name: Release Please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  manifest-file: .github/.release-manifest.json
                  config-file: .github/.release-config.json
                  # A PAT lets the release PR trigger the quality workflow;
                  # GITHUB_TOKEN works but its PRs do not start other runs.
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

    # extensions.gnome.org has no upload API, so the zip is attached to the
    # GitHub release and submitted by hand at https://extensions.gnome.org/upload/
    bundle:
        name: Bundle extension
        needs: release-please
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name }}
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: install
              run: |
                  bun install --frozen-lockfile
                  sudo apt-get update
                  sudo apt-get install --no-install-recommends -y libglib2.0-bin

            - name: pack
              run: bun run pack

            - name: upload
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "${{ needs.release-please.outputs.tag_name }}" dist/*.shell-extension.zip --clobber
